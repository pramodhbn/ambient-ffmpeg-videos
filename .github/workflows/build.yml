name: Build LGPL macOS FFmpeg

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ffmpeg_tag:
        description: 'FFmpeg Git Tag/Branch (e.g. n7.1)'
        required: true
        default: 'n7.1'
      release_tag:
        description: 'GitHub Release Tag (e.g. v7.1-lgpl-1)'
        required: true
        default: 'v7.1-lgpl-1'

jobs:
  build:
    name: Build FFmpeg (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: arm64
            os: macos-14
          - arch: x64
            os: macos-13

    steps:
      - name: Install build tools
        run: brew install nasm

      - name: Clone FFmpeg
        run: |
          FFMPEG_REF="${{ github.event.inputs.ffmpeg_tag || 'n7.1' }}"
          git clone --depth 1 --branch "$FFMPEG_REF" https://github.com/FFmpeg/FFmpeg.git ffmpeg-src

      - name: Configure & Compile FFmpeg
        working-directory: ffmpeg-src
        run: |
          ./configure \
            --prefix=./dist \
            --disable-gpl \
            --disable-nonfree \
            --disable-version3 \
            --disable-everything \
            --disable-doc \
            --disable-debug \
            --disable-ffplay \
            --disable-ffprobe \
            --disable-network \
            --disable-autodetect \
            --enable-protocol=file,pipe \
            --enable-filter=aresample,aformat \
            --enable-muxer=pcm_f32le \
            --enable-demuxer=mov,mp3,wav,aiff,aac,ogg,flac,matroska,asf \
            --enable-decoder=aac,aac_latm,alac,mp3,mp3float,pcm_s16le,pcm_s24le,pcm_s32le,pcm_f32le,vorbis,opus,flac,wmav1,wmav2,wmapro \
            --enable-static \
            --disable-shared

          make -j$(sysctl -n hw.ncpu)
          strip ffmpeg

      - name: Verify Binary & Interlocks
        working-directory: ffmpeg-src
        run: |
          ./ffmpeg -version
          echo "Checking MOV demuxer..."
          ./ffmpeg -demuxers | grep -E "mov"
          echo "Checking AAC decoder..."
          ./ffmpeg -decoders | grep -E "aac"
          echo "Checking F32LE (PCM Float32) muxer..."
          ./ffmpeg -muxers | grep -E "f32le"

      - name: Package Binary & Compute Checksum
        run: |
          mkdir -p package
          cp ffmpeg-src/ffmpeg package/ffmpeg
          chmod +x package/ffmpeg
          tar -czvf "ffmpeg-darwin-${{ matrix.arch }}.tar.gz" -C package ffmpeg
          shasum -a 256 "ffmpeg-darwin-${{ matrix.arch }}.tar.gz" > "ffmpeg-darwin-${{ matrix.arch }}.tar.gz.sha256"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-darwin-${{ matrix.arch }}
          path: |
            ffmpeg-darwin-${{ matrix.arch }}.tar.gz
            ffmpeg-darwin-${{ matrix.arch }}.tar.gz.sha256
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksum Summary
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt

      - name: Determine Release Tag
        id: tag
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            TAG="${{ github.event.inputs.release_tag || 'v7.1-lgpl-1' }}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=FFmpeg 7.1 LGPL macOS ($TAG)" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.title }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.sha256
            release-assets/SHA256SUMS.txt
          draft: false
          prerelease: false
          body: |
            ## Ambient FFmpeg LGPL Builds for macOS

            Standalone, minimalist LGPL v2.1+ builds of FFmpeg tailored for local audio decoding in Ambient.

            ### Target Architectures:
            * `ffmpeg-darwin-arm64.tar.gz` (Apple Silicon M1/M2/M3/M4)
            * `ffmpeg-darwin-x64.tar.gz` (Intel x86_64)

            ### Included Demuxers & Decoders:
            * **Containers**: `mov` (mp4/m4a/mov/m4v), `mp3`, `wav`, `aiff`, `aac`, `ogg`, `flac`, `webm`, `asf` (wma)
            * **Audio Codecs**: `aac`, `alac`, `mp3`, `vorbis`, `opus`, `flac`, `wmav1/2/pro`, `pcm_*`
            * **Output**: `pcm_f32le` (16 kHz mono float32)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
