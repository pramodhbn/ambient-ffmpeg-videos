# Video flip of ambient-ffmpeg-macos: GPL + static libx264 + the video codec closure.
# The Verify step is the gate: every needed capability is READ from the built binary;
# a missing one fails the build. First run: workflow_dispatch with the defaults.

name: Build GPL macOS FFmpeg (video)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ffmpeg_tag:
        description: 'FFmpeg Git Tag/Branch (e.g. n7.1)'
        required: true
        default: 'n7.1'
      release_tag:
        description: 'GitHub Release Tag (e.g. v7.1-gpl-video-1)'
        required: true
        default: 'v7.1-gpl-video-1'

jobs:
  build:
    name: Build FFmpeg video (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      matrix:
        arch: [arm64, x64]

    steps:
      - name: Install build tools
        run: brew install nasm

      - name: Build static x264 (${{ matrix.arch }})
        run: |
          git clone --depth 1 https://code.videolan.org/videolan/x264.git x264-src
          cd x264-src
          if [ "${{ matrix.arch }}" = "x64" ]; then
            ./configure --prefix="$PWD/dist" --enable-static --disable-cli \
              --host=x86_64-apple-darwin \
              --extra-cflags="-arch x86_64" --extra-ldflags="-arch x86_64"
          else
            ./configure --prefix="$PWD/dist" --enable-static --disable-cli
          fi
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Clone FFmpeg
        run: |
          FFMPEG_REF="${{ github.event.inputs.ffmpeg_tag || 'n7.1' }}"
          git clone --depth 1 --branch "$FFMPEG_REF" https://github.com/FFmpeg/FFmpeg.git ffmpeg-src

      - name: Configure & Compile FFmpeg
        working-directory: ffmpeg-src
        run: |
          X264="$GITHUB_WORKSPACE/x264-src/dist"
          COMMON_FLAGS="
            --prefix=./dist
            --enable-gpl
            --enable-libx264
            --disable-nonfree
            --disable-version3
            --disable-everything
            --disable-doc
            --disable-debug
            --disable-ffplay
            --disable-ffprobe
            --disable-network
            --disable-autodetect
            --enable-protocol=file,pipe
            --enable-indev=lavfi
            --enable-filter=scale,pad,setsar,fps,format,aresample,aformat,anull,anullsrc,color,testsrc
            --enable-demuxer=mov,concat,image2,image2pipe,png_pipe
            --enable-decoder=h264,aac,png
            --enable-encoder=libx264,aac
            --enable-muxer=mp4
            --enable-parser=h264,aac
            --enable-bsf=aac_adtstoasc,h264_mp4toannexb
            --enable-static
            --disable-shared
          "
          if [ "${{ matrix.arch }}" = "x64" ]; then
            ./configure $COMMON_FLAGS \
              --arch=x86_64 --target-os=darwin --enable-cross-compile \
              --extra-cflags="-arch x86_64 -I$X264/include" \
              --extra-ldflags="-arch x86_64 -L$X264/lib" \
              --pkg-config-flags="--static" \
              --disable-x86asm
          else
            ./configure $COMMON_FLAGS \
              --extra-cflags="-I$X264/include" \
              --extra-ldflags="-L$X264/lib" \
              --pkg-config-flags="--static"
          fi
          make -j"$(sysctl -n hw.ncpu)"
          strip ffmpeg

      - name: Verify Binary & Interlocks (the gate — every capability READ, not assumed)
        working-directory: ffmpeg-src
        run: |
          file ./ffmpeg
          ./ffmpeg -version
          echo "— license line must say GPL version 2 or later —"
          ./ffmpeg -version | grep -i "gpl"
          check() { echo "checking $1 for '$2'…"; ./ffmpeg -hide_banner "$1" 2>/dev/null | grep -E "$2"; }
          check -encoders 'libx264'
          check -encoders '^ A.*aac'
          check -decoders '^ V.*h264'
          check -decoders '^ V.*png'
          check -decoders '^ A.*aac'
          check -demuxers 'concat'
          check -demuxers 'mov'
          check -demuxers 'image2'
          check -muxers ' mp4 '
          check -filters 'scale'
          check -filters 'pad'
          check -filters 'anullsrc'
          echo "— the lavfi door (anullsrc as an input device) —"
          ./ffmpeg -hide_banner -f lavfi -t 0.1 -i anullsrc=r=48000:cl=stereo -f null - 2>&1 | tail -1

      - name: Package Binary & Compute Checksum
        run: |
          mkdir -p package
          cp ffmpeg-src/ffmpeg package/ffmpeg
          chmod +x package/ffmpeg
          tar -czvf "ffmpeg-darwin-${{ matrix.arch }}.tar.gz" -C package ffmpeg
          shasum -a 256 "ffmpeg-darwin-${{ matrix.arch }}.tar.gz" > "ffmpeg-darwin-${{ matrix.arch }}.tar.gz.sha256"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-darwin-${{ matrix.arch }}
          path: |
            ffmpeg-darwin-${{ matrix.arch }}.tar.gz
            ffmpeg-darwin-${{ matrix.arch }}.tar.gz.sha256
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksum Summary
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt

      - name: Determine Release Tag
        id: tag
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            TAG="${{ github.event.inputs.release_tag || 'v7.1-gpl-video-1' }}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=FFmpeg 7.1 GPL video macOS ($TAG)" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.title }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.sha256
            release-assets/SHA256SUMS.txt
          draft: false
          prerelease: false
          body: |
            ## Ambient FFmpeg GPL video builds for macOS

            Standalone, minimalist **GPL v2+** builds of FFmpeg for LOCAL video assembly
            in [AmbientContent](https://letsambient.com) — voiced clips + end cards →
            one finished video, entirely on the user's machine.

            Includes **libx264** (software H.264 — no GPU/OS encoder dependency), aac,
            h264/png decode, mov/concat/image2/lavfi in, mp4 out, scale/pad/fps filters.
            Built from the exact pinned FFmpeg + x264 sources this workflow names —
            this repository IS the corresponding-source offer.

            * `ffmpeg-darwin-arm64.tar.gz` (Apple Silicon)
            * `ffmpeg-darwin-x64.tar.gz` (Intel)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
