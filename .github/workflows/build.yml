# Video flip of ambient-ffmpeg-macos: GPL + static libx264 + the video codec closure.
# The Verify step is the gate: every needed capability is READ from the built binary;
# a missing one fails the build. First run: workflow_dispatch with the defaults.
#
# HISTORY, recorded not hidden (11 Sep 2026, MAC-1e step 1):
#   v7.1-gpl-video-1 (29 Aug) was built from commit 4a20ddb — the allowlist as it stood
#   then (scale/pad/fps · h264/aac/png · mp4).
#   v7.1-gpl-video-2 (04 Sep) shipped the WIDER closure AmbientContent's arg builders ask
#   for (hevc/mjpeg/mp3/pcm decode · f32le/wav/image2 out · loudnorm/amix/xfade/… filters).
#   Its workflow WAS committed — on branch `video-2` (a2c0455, three commits), which was
#   never merged — and the release tag was placed on 4a20ddb (main) instead of on that
#   branch's head. So the tag pointed at a workflow that did not build the binary, and the
#   README's "this repository IS the corresponding-source offer" held only for a reader who
#   knew to look at an unmerged branch. (Commit 419d797's message and the first version of
#   this note said "never committed" — WRONG; the branch existed. Corrected here, and the
#   branch is merged into main by the commit that carries this note.)
#   The lists below were recovered INDEPENDENTLY from the shipped binaries' OWN configure
#   lines (both arches downloaded, SHA-256 == the pins in AmbientContent's
#   scripts/fetch-ffmpeg.cjs, the `configuration:` string read from the bytes), then
#   diffed against the branch's file: IDENTICAL. Two readings, one list.
#   The Verify step was also rewritten: the v1 gate PRINTED the anullsrc probe's failure
#   and went green; every check here matches the NAME COLUMN of the listing (never a
#   substring anywhere on the line) and every probe is asserted by exit code.
#
# MAC-1e step 2 (11 Sep 2026): libass joins the build so the Mac can BURN subtitles —
#   v7.1-gpl-video-2 had no libass, the `ass` filter did not exist, and AmbientContent's
#   "Burn Subtitles & Overlays" failed on every Mac with ffmpeg's parser error. The font
#   stack is built STATIC for both arches (FreeType · FriBidi · HarfBuzz · libass), from
#   pinned release tarballs; each tarball's SHA-256 is PRINTED by the build so the pins can
#   be READ from the first green run's log and then committed (never typed from memory).
#   A workflow_dispatch no longer publishes a release unless `publish` is true — a tag push
#   is the release path, because a tag push is the only trigger that guarantees the tag
#   sits on the commit whose workflow built the binary (the video-2 lesson).

name: Build GPL macOS FFmpeg (video)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ffmpeg_tag:
        description: 'FFmpeg Git Tag/Branch (e.g. n7.1)'
        required: true
        default: 'n7.1'
      release_tag:
        description: 'GitHub Release Tag (used ONLY when publish=true)'
        required: true
        default: 'v7.1-gpl-video-3'
      publish:
        description: 'Publish a GitHub Release from this dispatch? (default false — exploratory builds never publish; release by pushing a tag)'
        required: false
        default: 'false'

env:
  # Pinned dependency releases: version + SHA-256, verified before extraction.
  # The hashes were READ, never typed: the three GitHub tarballs from run 34565110785's
  # own "shasum" line, FreeType from two independent hosts (the Savannah mirror
  # redirector and SourceForge, identical bytes) on 11 Sep 2026. That run also showed why
  # a pin must be checked BEFORE untar: download.savannah.gnu.org answered a 166-byte HTML
  # page, and tar said only "Unrecognized archive format" without naming the file.
  FREETYPE_VER: 2.13.3
  FREETYPE_SHA256: 0550350666d427c74daeb85d5ac7bb353acba5f76956395995311a9c6f063289
  FRIBIDI_VER: 1.0.16
  FRIBIDI_SHA256: 1b1cde5b235d40479e91be2f0e88a309e3214c8ab470ec8a2744d82a5a9ea05c
  HARFBUZZ_VER: 11.0.0
  HARFBUZZ_SHA256: f16351bafe214725fe2c1d5b59f0d93e49905a4b247899fb90d70cff953a2b9b
  LIBASS_VER: 0.17.3
  LIBASS_SHA256: eae425da50f0015c21f7b3a9c7262a910f0218af469e22e2931462fed3c50959

jobs:
  build:
    name: Build FFmpeg video (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      # Both arches REPORT: a failure on one must not cancel the other's Verify — run
      # 34565460032 cancelled arm64 while x64 was the only one that had spoken.
      fail-fast: false
      matrix:
        arch: [arm64, x64]

    steps:
      - name: Install build tools
        run: brew install nasm meson ninja pkg-config

      - name: Build static x264 (${{ matrix.arch }})
        run: |
          git clone --depth 1 https://code.videolan.org/videolan/x264.git x264-src
          cd x264-src
          if [ "${{ matrix.arch }}" = "x64" ]; then
            ./configure --prefix="$PWD/dist" --enable-static --disable-cli \
              --host=x86_64-apple-darwin \
              --extra-cflags="-arch x86_64" --extra-ldflags="-arch x86_64"
          else
            ./configure --prefix="$PWD/dist" --enable-static --disable-cli
          fi
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Fetch font stack sources (pinned versions + SHA-256, VERIFIED before extraction)
        run: |
          set -euo pipefail
          mkdir -p deps-src && cd deps-src
          # FreeType comes from the Savannah MIRROR redirector: the primary host
          # (download.savannah.gnu.org) answers with a tiny HTML page (run 34565110785).
          curl -sSL -o "freetype-$FREETYPE_VER.tar.xz" "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-$FREETYPE_VER.tar.xz"
          curl -sSL -o "fribidi-$FRIBIDI_VER.tar.xz"   "https://github.com/fribidi/fribidi/releases/download/v$FRIBIDI_VER/fribidi-$FRIBIDI_VER.tar.xz"
          curl -sSL -o "harfbuzz-$HARFBUZZ_VER.tar.xz" "https://github.com/harfbuzz/harfbuzz/releases/download/$HARFBUZZ_VER/harfbuzz-$HARFBUZZ_VER.tar.xz"
          curl -sSL -o "libass-$LIBASS_VER.tar.xz"     "https://github.com/libass/libass/releases/download/$LIBASS_VER/libass-$LIBASS_VER.tar.xz"
          echo "— every tarball: size, type, SHA-256 against the pin — a mismatch names the FILE —"
          ls -l *.tar.xz
          file *.tar.xz
          printf '%s  %s\n' \
            "$FREETYPE_SHA256" "freetype-$FREETYPE_VER.tar.xz" \
            "$FRIBIDI_SHA256"  "fribidi-$FRIBIDI_VER.tar.xz" \
            "$HARFBUZZ_SHA256" "harfbuzz-$HARFBUZZ_VER.tar.xz" \
            "$LIBASS_SHA256"   "libass-$LIBASS_VER.tar.xz" > SHA256SUMS.pins
          shasum -a 256 -c SHA256SUMS.pins
          for f in *.tar.xz; do tar -xJf "$f"; done
          ls -d */

      - name: Build static font stack + libass (${{ matrix.arch }})
        run: |
          set -euo pipefail
          DEPS="$GITHUB_WORKSPACE/deps-${{ matrix.arch }}"
          mkdir -p "$DEPS"
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig"
          NCPU="$(sysctl -n hw.ncpu)"
          if [ "${{ matrix.arch }}" = "x64" ]; then
            # Cross-compile for Intel on the arm64 runner: the arch rides on the compiler
            # itself (the most reliable way through autotools), and --host names the target.
            export CC="clang -arch x86_64" CXX="clang++ -arch x86_64"
            HOST="--host=x86_64-apple-darwin"
            # meson needs a cross file for HarfBuzz.
            cat > "$GITHUB_WORKSPACE/x64.cross" <<'CROSS'
          [binaries]
          c = 'clang'
          cpp = 'clang++'
          ar = 'ar'
          strip = 'strip'
          pkg-config = 'pkg-config'

          [built-in options]
          c_args = ['-arch', 'x86_64']
          cpp_args = ['-arch', 'x86_64']
          c_link_args = ['-arch', 'x86_64']
          cpp_link_args = ['-arch', 'x86_64']

          [host_machine]
          system = 'darwin'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          CROSS
            MESON_CROSS="--cross-file=$GITHUB_WORKSPACE/x64.cross"
          else
            HOST=""
            MESON_CROSS=""
          fi

          echo "=== FreeType $FREETYPE_VER (static; no png/bzip2/brotli/harfbuzz — the glyph rasteriser only) ==="
          cd "$GITHUB_WORKSPACE/deps-src/freetype-$FREETYPE_VER"
          ./configure --prefix="$DEPS" --enable-static --disable-shared $HOST \
            --with-zlib=yes --with-png=no --with-bzip2=no --with-brotli=no --with-harfbuzz=no
          make -j"$NCPU" && make install

          echo "=== FriBidi $FRIBIDI_VER (static; bidi for RTL scripts) ==="
          cd "$GITHUB_WORKSPACE/deps-src/fribidi-$FRIBIDI_VER"
          ./configure --prefix="$DEPS" --enable-static --disable-shared $HOST --disable-docs
          make -j"$NCPU" && make install

          echo "=== HarfBuzz $HARFBUZZ_VER (static, meson; shaping for Indic and every complex script) ==="
          cd "$GITHUB_WORKSPACE/deps-src/harfbuzz-$HARFBUZZ_VER"
          meson setup build --prefix="$DEPS" --libdir=lib --default-library=static --buildtype=release $MESON_CROSS \
            -Dfreetype=enabled -Dglib=disabled -Dgobject=disabled -Dcairo=disabled -Dicu=disabled -Dchafa=disabled \
            -Dcoretext=disabled -Dtests=disabled -Ddocs=disabled -Dutilities=disabled -Dintrospection=disabled -Dbenchmark=disabled
          meson compile -C build
          meson install -C build

          echo "=== libass $LIBASS_VER (static; CoreText is the system font provider on darwin, no fontconfig) ==="
          cd "$GITHUB_WORKSPACE/deps-src/libass-$LIBASS_VER"
          ./configure --prefix="$DEPS" --enable-static --disable-shared $HOST \
            --disable-fontconfig --enable-coretext --disable-asm
          make -j"$NCPU" && make install

          echo "=== what pkg-config will hand ffmpeg for libass (static) ==="
          pkg-config --static --libs --cflags libass
          ls "$DEPS/lib"

      - name: Clone FFmpeg
        run: |
          FFMPEG_REF="${{ github.event.inputs.ffmpeg_tag || 'n7.1' }}"
          git clone --depth 1 --branch "$FFMPEG_REF" https://github.com/FFmpeg/FFmpeg.git ffmpeg-src

      - name: Configure & Compile FFmpeg
        working-directory: ffmpeg-src
        run: |
          X264="$GITHUB_WORKSPACE/x264-src/dist"
          DEPS="$GITHUB_WORKSPACE/deps-${{ matrix.arch }}"
          # ffmpeg configure finds libx264 (and libass) THROUGH pkg-config — the static
          # builds are invisible without this (first dispatch failed exactly here: "ERROR:
          # x264 not found using pkg-config", 290826).
          export PKG_CONFIG_PATH="$X264/lib/pkgconfig:$DEPS/lib/pkgconfig:$PKG_CONFIG_PATH"
          # THE CLOSURE — what AmbientContent's arg builders ask for (ffmpegService ·
          # videoEditService · videoStitch · brandFrame · cardRenderer), as shipped in
          # v7.1-gpl-video-2, plus (video-3) libass and the two subtitle filters, and the
          # ass demuxer/decoder the `subtitles` filter reads through. Configure names, NOT
          # listing names: the f32le muxer/demuxer is `pcm_f32le` here and lists as `f32le`
          # (video-2 run 1 failed on exactly that). `--enable-zlib` is load-bearing: with
          # --disable-autodetect, zlib is off and the png decoder that needs it is dropped
          # SILENTLY (video-1 run 2). `--extra-libs=-lc++` is HarfBuzz's C++ runtime: ffmpeg
          # links with clang, not clang++, so a static C++ library needs it named.
          # The png pipe demuxer's configure name is `image_png_pipe` (from the symbol
          # ff_image_png_pipe_demuxer in libavformat/allformats.c); it LISTS as `png_pipe`.
          # configure silently ignores a component name it does not know, so video-2
          # (`--enable-demuxer=…,png_pipe`) shipped WITHOUT it and nothing said so — the
          # shipped video-2 binaries carry no "piped png sequence" string. Video-3 run 2's
          # Verify (the first to check the name column for png_pipe) is what caught it.
          COMMON_FLAGS="
            --prefix=./dist
            --enable-gpl
            --enable-libx264
            --enable-libass
            --disable-nonfree
            --disable-version3
            --disable-everything
            --disable-doc
            --disable-debug
            --disable-ffplay
            --disable-ffprobe
            --disable-network
            --disable-autodetect
            --enable-zlib
            --enable-protocol=file,pipe
            --enable-indev=lavfi
            --enable-filter=scale,pad,setsar,fps,format,aresample,aformat,anull,anullsrc,color,testsrc,loudnorm,amix,xfade,acrossfade,sidechaincompress,afade,asplit,volume,overlay,atrim,trim,setpts,asetpts,apad,split,null,crop,fade,concat,ass,subtitles
            --enable-demuxer=mov,concat,image2,image2pipe,image_png_pipe,mp3,wav,pcm_f32le,ass
            --enable-decoder=h264,hevc,aac,png,mjpeg,mp3float,pcm_u8,pcm_s16le,pcm_s24le,pcm_f32le,ass
            --enable-encoder=libx264,aac,png,mjpeg,pcm_f32le,pcm_s16le
            --enable-muxer=mp4,mov,image2,pcm_f32le,wav,null
            --enable-parser=h264,hevc,aac,mpegaudio,png,mjpeg
            --enable-bsf=aac_adtstoasc,h264_mp4toannexb,hevc_mp4toannexb
            --enable-static
            --disable-shared
            --extra-libs=-lc++
          "
          if [ "${{ matrix.arch }}" = "x64" ]; then
            ./configure $COMMON_FLAGS \
              --arch=x86_64 --target-os=darwin --enable-cross-compile \
              --extra-cflags="-arch x86_64 -I$X264/include -I$DEPS/include" \
              --extra-ldflags="-arch x86_64 -L$X264/lib -L$DEPS/lib" \
              --pkg-config-flags="--static" \
              --disable-x86asm
          else
            ./configure $COMMON_FLAGS \
              --extra-cflags="-I$X264/include -I$DEPS/include" \
              --extra-ldflags="-L$X264/lib -L$DEPS/lib" \
              --pkg-config-flags="--static"
          fi
          make -j"$(sysctl -n hw.ncpu)"
          strip ffmpeg

      - name: Verify Binary & Interlocks (the gate — every capability READ from the name column, every probe ASSERTED)
        working-directory: ffmpeg-src
        run: |
          set -euo pipefail
          file ./ffmpeg
          ./ffmpeg -version
          echo "— license line must say GPL —"
          ./ffmpeg -version | grep -i "gpl"
          echo "— the binary must be self-contained: no dylib outside the OS —"
          otool -L ./ffmpeg
          if otool -L ./ffmpeg | grep -vE '^\./ffmpeg:|/usr/lib/|/System/Library/'; then echo "NON-SYSTEM DYLIB LINKED"; exit 1; fi

          # has <listing-flag> <name>: the name must be an EXACT entry in the listing's
          # NAME column (codecs/filters/formats print flags in $1 and the name in $2; a
          # format's name may itself be a comma list, e.g. "mov,mp4,m4a,3gp,3g2,mj2").
          # A substring match anywhere on the line would let a description word ("null",
          # "png") certify a capability that was never built — the video-1 run 2 shape.
          has() {
            if ./ffmpeg -hide_banner "$1" 2>/dev/null | awk 'NF>=2 {print $2}' | tr ',' '\n' | grep -qx -- "$2"; then
              echo "ok      $1 $2"
            else
              echo "MISSING $1 $2"; return 1
            fi
          }
          # bare listings: -bsfs and -protocols print one name per line, INDENTED under
          # section headers ("Input:" / "Output:") — strip leading whitespace before the
          # exact match. (Executed against a full Windows build before the first
          # dispatch: without the strip, `file` and `pipe` read as MISSING.)
          bare() {
            if ./ffmpeg -hide_banner "$1" 2>/dev/null | sed 's/^[[:space:]]*//' | grep -qx -- "$2"; then
              echo "ok      $1 $2"
            else
              echo "MISSING $1 $2"; return 1
            fi
          }

          echo "— encoders —"
          for x in libx264 aac png mjpeg pcm_f32le pcm_s16le; do has -encoders "$x"; done
          echo "— decoders —"
          for x in h264 hevc aac png mjpeg mp3float pcm_u8 pcm_s16le pcm_s24le pcm_f32le ass; do has -decoders "$x"; done
          echo "— demuxers (listing names: pcm_f32le lists as f32le) —"
          for x in mov concat image2 image2pipe png_pipe mp3 wav f32le ass; do has -demuxers "$x"; done
          echo "— muxers (listing names: pcm_f32le lists as f32le) —"
          for x in mp4 mov image2 f32le wav null; do has -muxers "$x"; done
          echo "— filters —"
          for x in scale pad setsar fps format aresample aformat anull anullsrc color testsrc loudnorm amix xfade acrossfade sidechaincompress afade asplit volume overlay atrim trim setpts asetpts apad split null crop fade concat ass subtitles; do has -filters "$x"; done
          echo "— bitstream filters —"
          for x in aac_adtstoasc h264_mp4toannexb hevc_mp4toannexb; do bare -bsfs "$x"; done
          echo "— protocols —"
          for x in file pipe; do bare -protocols "$x"; done

          echo "— DRIVEN probes (asserted by exit code under set -e) —"
          echo "  lavfi door: anullsrc as an input device → null muxer"
          ./ffmpeg -hide_banner -loglevel error -f lavfi -t 0.1 -i anullsrc=r=48000:cl=stereo -f null -
          echo "  the Whisper path: anullsrc → 16 kHz mono raw f32le (the exact shape ffmpegService sends); size ASSERTED"
          ./ffmpeg -hide_banner -loglevel error -y -f lavfi -t 0.2 -i anullsrc=r=48000:cl=stereo -vn -ac 1 -ar 16000 -f f32le probe.f32le
          test "$(wc -c < probe.f32le)" -eq 12800   # 0.2 s × 16000 Hz × 4 bytes — the video-2 branch's own assertion, kept
          echo "  the assembly path: testsrc + anullsrc → libx264/aac → mp4"
          ./ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc=d=0.5:s=64x64:r=10 -f lavfi -t 0.5 -i anullsrc=r=48000:cl=stereo -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest probe.mp4
          test -s probe.mp4
          echo "  the stitch path: two clips through the concat demuxer, then xfade + acrossfade"
          cp probe.mp4 probe2.mp4
          printf "file 'probe.mp4'\nfile 'probe2.mp4'\n" > list.txt
          ./ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i list.txt -c:v libx264 -pix_fmt yuv420p -c:a aac concat.mp4
          test -s concat.mp4
          ./ffmpeg -hide_banner -loglevel error -y -i probe.mp4 -i probe2.mp4 -filter_complex "[0:v][1:v]xfade=transition=fade:duration=0.2:offset=0.2[v];[0:a][1:a]acrossfade=d=0.2[a]" -map "[v]" -map "[a]" -c:v libx264 -pix_fmt yuv420p -c:a aac xfade.mp4
          test -s xfade.mp4

          echo "  the SUBTITLE path (video-3): burn a one-line .ass onto a black frame; the EFFECT is asserted on pixels"
          # A font in fontsdir, the way AmbientContent passes its bundled brand faces. Any
          # TrueType on the runner will do for the probe; the app ships its own.
          mkdir -p fonts
          F="$(ls /System/Library/Fonts/Supplemental/Arial.ttf /System/Library/Fonts/Supplemental/Verdana.ttf /Library/Fonts/Arial.ttf 2>/dev/null | head -1 || true)"
          if [ -n "$F" ]; then cp "$F" fonts/; echo "  fontsdir font: $F"; else echo "  no TrueType found for fontsdir — the probe falls back to CoreText's system provider"; fi
          printf '[Script Info]\nScriptType: v4.00+\nPlayResX: 320\nPlayResY: 180\n\n[V4+ Styles]\nFormat: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\nStyle: Default,Arial,40,&H00FFFFFF,&H000000FF,&H00000000,&H00000000,0,0,0,0,100,100,0,0,1,2,0,5,10,10,10,1\n\n[Events]\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\nDialogue: 0,0:00:00.00,0:00:01.00,Default,,0,0,0,,BURN\n' > probe.ass
          ./ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=black:s=320x180:d=1:r=1 -frames:v 1 plain.png
          ./ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=black:s=320x180:d=1:r=1 -vf "ass=probe.ass:fontsdir=fonts" -frames:v 1 burned.png
          test -s plain.png && test -s burned.png
          if cmp -s plain.png burned.png; then echo "  BURN HAD NO EFFECT: burned frame is byte-identical to the plain frame (libass found no glyphs?)"; exit 1; fi
          echo "  burn changed the frame: $(wc -c < plain.png) bytes plain vs $(wc -c < burned.png) bytes burned"
          echo "  the subtitles filter (ffmpeg's ass demuxer/decoder → libass) must also load the same file"
          ./ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=black:s=320x180:d=1:r=1 -vf "subtitles=probe.ass:fontsdir=fonts" -frames:v 1 burned2.png
          if cmp -s plain.png burned2.png; then echo "  subtitles= HAD NO EFFECT"; exit 1; fi
          echo "VERIFY: every capability present, every probe green"

      - name: Package Binary & Compute Checksum
        run: |
          mkdir -p package
          cp ffmpeg-src/ffmpeg package/ffmpeg
          chmod +x package/ffmpeg
          tar -czvf "ffmpeg-darwin-${{ matrix.arch }}.tar.gz" -C package ffmpeg
          shasum -a 256 "ffmpeg-darwin-${{ matrix.arch }}.tar.gz" > "ffmpeg-darwin-${{ matrix.arch }}.tar.gz.sha256"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-darwin-${{ matrix.arch }}
          path: |
            ffmpeg-darwin-${{ matrix.arch }}.tar.gz
            ffmpeg-darwin-${{ matrix.arch }}.tar.gz.sha256
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    # A tag push publishes. A dispatch publishes ONLY when asked (publish=true) — so an
    # exploratory build can never create a release by accident, and a release tag always
    # sits on the commit whose workflow built it.
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksum Summary
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt

      - name: Determine Release Tag
        id: tag
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            TAG="${{ github.event.inputs.release_tag || 'v7.1-gpl-video-3' }}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=FFmpeg 7.1 GPL video macOS ($TAG)" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.title }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.sha256
            release-assets/SHA256SUMS.txt
          draft: false
          prerelease: false
          body: |
            ## Ambient FFmpeg GPL video builds for macOS

            Standalone, minimalist **GPL v2+** builds of FFmpeg for LOCAL video work
            in [AmbientContent](https://letsambient.com) — voiced clips + end cards →
            one finished video, the user's own footage edited, subtitled and branded,
            entirely on the user's machine.

            Includes **libx264** (software H.264 — no GPU/OS encoder dependency) and
            **libass** (subtitle burning, with FreeType · FriBidi · HarfBuzz built in,
            so Indic and RTL scripts shape correctly); decode h264/hevc/aac/png/mjpeg/
